name: publicar no PyPI

# Roda quando um release é publicado no GitHub (tag como v0.1.0).
# Usa "trusted publishing": não precisa de senha nem token guardado no repositório.

on:
  release:
    types: [published]

jobs:
  construir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Versão da tag confere com o pacote
        run: |
          v=$(python -c "import grafo_neon; print(grafo_neon.__version__)")
          test "${GITHUB_REF_NAME#v}" = "$v" || { echo "A tag é $GITHUB_REF_NAME, mas grafo_neon/__init__.py está na versão $v"; exit 1; }
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publicar:
    needs: construir
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/grafo-neon
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
