name: testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Analisador do site (JavaScript)
        run: node --test testes/analisador.test.js
      - name: Script de linha de comando e paridade com o site (Python)
        run: python -m unittest discover -s testes -v
      - name: Sintaxe dos arquivos do site
        run: for f in analisador.js app.js grafo_neon/grafo.js grafo_neon/render.js; do node --check "$f"; done
      - name: Pacote constrói, instala e roda
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          grafo-neon --version
          grafo-neon "$GITHUB_WORKSPACE/testes/fixtures/python" -o grafo.html
          test -s grafo.html
